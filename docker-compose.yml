services:
  postgres:
    image: postgres:16
    container_name: wind_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wind_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
  airflow-db:
    image: postgres:16
    container_name: airflow_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_pgdata:/var/lib/postgresql/data

  airflow:
    image: apache/airflow:2.9.3
    container_name: wind_airflow
    depends_on:
      - airflow-db
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      DB_HOST: postgres
      DB_PORT: "5432"
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/dags/src
      - ./wind_data.csv:/opt/airflow/dags/wind_data.csv
    command: standalone
  
  superset:
    build:
      context: .
      dockerfile: Dockerfile.superset
    container_name: wind_superset
    environment:
      SUPERSET_SECRET_KEY: "twoj_tajny_klucz_123"
    ports:
      - "8088:8088"

volumes:
  pgdata:
  airflow_pgdata:
  

